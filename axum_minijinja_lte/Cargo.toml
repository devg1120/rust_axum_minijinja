[package]
name = "axum_migration_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
minijinja = { version = "2.0", features = ["loader"] }
serde = { version = "1.0", features = ["derive"] }
# 静的ファイル配信とロギング用
tower-http = { version = "0.5", features = ["fs", "trace"] }


