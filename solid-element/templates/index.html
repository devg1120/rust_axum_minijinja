<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <!-- SolidJS (solid-element) がビルドされたJavaScriptファイルを読み込む -->
    <script type="module" src="/assets/index.js" defer></script>
</head>
<body>
    <h1>{{ message }}</h1>

    <hr>

    <h3>1. デフォルト設定のカウンター</h3>
    <!-- 標準のHTMLタグのように記述可能 -->
    <my-counter></my-counter>

    <h3>2. サーバーサイド（MiniJinja）から初期値を渡すカウンター</h3>
    <!-- MiniJinjaの変数をそのまま属性（Attribute）に埋め込める -->
    <my-counter initial="{{ initial_count }}" step="5"></my-counter>

</body>
</html>
