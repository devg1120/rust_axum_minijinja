[package]
name = "axum_sqlite_minijinja_demo"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
minijinja = { version = "2.0", features = ["loader"] }
serde = { version = "1.0", features = ["derive"] }
