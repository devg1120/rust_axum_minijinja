[package]
name = "axum-minijinja-realtime"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
minijinja = { version = "3.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
urlencoding = "2.1"

